<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Hello</h1>
<h1>Welcome</h1>
<p>JavaScript</p>
<p>DOM</p>



<script>
    p = document.getElementsByTagName("p")
    console.log(p);
    console.log(p.length);
    console.log(p[0]);
    console.log(p[1]);
    console.log(p[2]);

    console.log("using loops");
    
    for(let i=0;i<p.length;i++){
        console.log(p[i]);
        
    }
    
//VERY IMPORTANT: HTMLCollection is LIVE
    let newpara = document.createElement("p");
    console.log(newpara);
    newpara.innerText = "newpara"
    document.body.appendChild(newpara)


    //note htmlcollection with returns the liveupdates immediately-HTMLCollection returned by getElementsByTagName() is live.

    
    
    
    
    
    
    // "getElementsByTagName() returns an HTMLCollection containing the matching elements."
</script>
</body>
</html>
