  <body>
    <h1>Experiments with the for loop</h1>

    <script>
      //Initialization outside

      let i = 1;

      for (; i <= 5; i++) {
        console.log(i);
      }
      console.log("*****************");

      //Update outside-You can also remove the update from the for statement.

      for (let a = 1; a <= 5; ) {
        console.log(a);
        a++;
      }
      console.log("*****************");

      //Initialization AND update outside
      let k = 1;

      for (; k <= 5; ) {
        console.log(k);
        k++;
      }
