<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compa</title>
</head>
<body>


    <script>
        let a = 100;
        let b = "100"


        console.log(`
        Loose equality(Compare values with type coercion.): ${a==b}
        Strict equality(Compare values and types without type coercion.): ${a ===b }
        Loose inequality(Not equal, after type coercion.): ${a != b}

        Strict inequality(!== checks whether either the value OR type is different.): ${a !== b}
        GreaterEqual: ${a >= b}
        LeserEqual: ${a<=b}
        Greater: ${a > b}
        Leser: ${a<b}`);
        
    </script>
    
</body>
</html>
