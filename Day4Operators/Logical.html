<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logical</title>
  </head>
  <body>
    <h1>Lets learns logical</h1>

    <script>
                  let a = 10;
                  let b = 20;

                  console.log(a < b && b > a);
                  console.log(a && b && 0 && 5);
                  console.log("" && "Hello");
                  console.log(" " && "Sting");
                  console.log([] && "Array");
                  console.log({} && "String");
                  console.log({} && "String");

                  console.log(10 && 11 && 12 && 13);
                  console.log(10 && 11 && 12 && 13);
                  console.log(a < b && b > a && " " && null && undefined);
                  console.log(a < b && undefined && b > a && " " && null && undefined);

                  console.log("***************************");
                  console.log(!0);
                  console.log(!1);
                  console.log(!"");
                  console.log(!"Hello");
                  console.log(![]);
                  console.log(!{});

                  console.log("&&&&&&&&&&&&&&&&&");
                  console.log([] && "Array");
                  console.log([] || "Array");

                  console.log({} && "Object");
                  console.log({} || "Object");

                  console.log(" " && "Hello");
                  console.log(" " || "Hello");


                  //Remember
    //               && searches for a problem (falsy).
    //         || searches for a solution (truthy).

    //         so,,,
    //         && → Find the FIRST FALSY value and stops
    //   || → Find the FIRST TRUTHY value andstops

                  // console.log(8 &&);
    </script>
  </body>
</html>
